<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Colab GPU Platform{% endblock %}</title>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; }
header .spacer { flex:1; }
.badge { padding:2px 10px; border-radius:12px; font-size:12px; border:1px solid var(--border); color:var(--muted); }
.badge.ok { color:var(--ok); border-color:var(--ok); }
.badge.warn { color:var(--warn); border-color:var(--warn); }
.badge.err { color:var(--err); border-color:var(--err); }
main { max-width:1080px; margin:0 auto; padding:22px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:18px; }
.panel h2 { margin:0 0 12px; font-size:15px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
th { color:var(--muted); font-weight:500; }
code, pre { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
pre { background:#0a0d12; border:1px solid var(--border); border-radius:6px; padding:12px; overflow:auto; max-height:420px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
input, textarea, select { background:#0a0d12; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:8px 10px; font:13px/1.4 inherit; width:100%; }
textarea { min-height:140px; font-family:ui-monospace,monospace; }
label { display:block; margin:10px 0 4px; color:var(--muted); font-size:12.5px; }
button, .btn { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
button:hover, .btn:hover { filter:brightness(1.15); }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row > div { flex:1; min-width:180px; }
.muted { color:var(--muted); font-size:12.5px; }
.st-QUEUED, .st-PROVISIONING { color:var(--warn); }
.st-RUNNING { color:var(--accent); }
.st-COMPLETE { color:var(--ok); }
.st-FAILED, .st-RECLAIMED { color:var(--err); }
.mono { font-family:ui-monospace,monospace; font-size:12px; }
.flash { border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin:10px 0; font-size:13px; }
.flash.ok { border-color:var(--ok); } .flash.err { border-color:var(--err); }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:var(--fg)">Colab GPU Platform</a></h1>
  <span class="badge {{ 'ok' if ctx.connected else 'err' }}">
    {{ ('connected' + (' · ' + ctx.identity.email if ctx.identity and ctx.identity.email else '')) if ctx.connected else 'not connected' }}
  </span>
  {% if ctx.password_protected %}<span class="badge">password-gated</span>{% endif %}
  <span class="spacer"></span>
  <a href="/connect">Connect</a>
  <a href="/artifacts">Artifacts</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
